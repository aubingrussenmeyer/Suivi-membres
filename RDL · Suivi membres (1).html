<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RDL · Suivi membres</title>
<style>
:root{--bg:#0e1117;--card:#171c26;--bd:#262d3b;--tx:#e8ebf2;--mu:#8b94a7;--ac:#6c8cff;--ok:#3ddc97;--wa:#ffb547;--er:#ff6b6b;--inp:#0e1117;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5fa;--card:#fff;--bd:#dfe3ee;--tx:#171c26;--mu:#667086;--inp:#f3f5fa;color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f5fa;--card:#fff;--bd:#dfe3ee;--tx:#171c26;--mu:#667086;--inp:#f3f5fa;color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 16px}
h1{margin:0;font-size:18px}h1 span{color:var(--ac)}
nav{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
nav button{flex:none;background:var(--card);color:var(--mu);border:1px solid var(--bd);border-radius:20px;padding:7px 14px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:980px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.k{font-size:28px;font-weight:700}.l{color:var(--mu);font-size:12px}
.k.ok{color:var(--ok)}.k.wa{color:var(--wa)}.k.ac{color:var(--ac)}
h2{font-size:12px;letter-spacing:.08em;color:var(--mu);margin:20px 0 8px;text-transform:uppercase}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ok))}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input,select,textarea{background:var(--inp);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;font:inherit;width:100%}
.tools input,.tools select{width:auto;flex:1;min-width:130px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer;font-weight:600}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--er)}.btn.s{padding:6px 11px;font-size:13px}
.m{display:flex;justify-content:space-between;gap:10px;cursor:pointer;border-left:4px solid var(--ok)}
.m.pend{border-left-color:var(--wa)}.m.rew{border-left-color:var(--ok);background:linear-gradient(90deg,#3ddc9718,transparent)}.m.off{border-left-color:var(--er);opacity:.6}
.m b{font-size:16px}.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bd);color:var(--mu);margin:2px 4px 0 0}
.tag.ok{background:#3ddc9722;color:var(--ok)}.tag.wa{background:#ffb54722;color:var(--wa)}.tag.er{background:#ff6b6b22;color:var(--er)}
.list{display:grid;gap:8px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:18px;width:min(520px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:#000a}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:12px;color:var(--mu);display:block}.f .w{grid-column:1/-1}
.row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
.mu{color:var(--mu);font-size:13px}.empty{text-align:center;color:var(--mu);padding:30px}
#st{font-size:11px;color:var(--mu);float:right}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif}
h1,h3,.k,.ht{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#090e1f;--card:#111a35;--bd:#1f2b52;--ac:#6d8dff;--ok:#34d6a0;--wa:#f2b544;--er:#ff7a6b;--inp:#0a1126}body{background:radial-gradient(900px 420px at 90% -10%,#2b3d9455,transparent),radial-gradient(700px 420px at -10% 15%,#0f8a6a40,transparent),var(--bg) fixed}}
:root[data-theme="dark"]{--bg:#090e1f;--card:#111a35;--bd:#1f2b52}
header{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
h1{font-size:20px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
h1::before{content:"";width:28px;height:28px;border-radius:9px;background:conic-gradient(from 210deg,#6d8dff,#34d6a0,#f2c14e,#6d8dff);box-shadow:0 0 18px #6d8dff66}
h1 small{font:500 12px 'DM Sans',sans-serif;color:var(--mu);margin-left:2px}
#st{margin-left:auto;float:none}
nav button{border-radius:12px;font-weight:500;transition:background .15s,color .15s}
nav button.on{background:linear-gradient(135deg,#6d8dff,#8a6dff);box-shadow:0 4px 14px #6d8dff55}
.card{border-radius:18px;box-shadow:0 8px 24px -14px #000a}
.grid .card{position:relative;overflow:hidden;padding-top:17px}
.grid .card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--ac)}
.grid .card:has(.k.ok)::before{background:var(--ok)}.grid .card:has(.k.wa)::before{background:var(--wa)}
.k{font-size:32px;font-weight:800;letter-spacing:-.02em}
h2{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font:700 15px 'Bricolage Grotesque',sans-serif;color:var(--tx);margin:26px 0 10px}
h2::before{content:"";width:4px;height:16px;border-radius:2px;background:#f2c14e}
.hero{display:grid;gap:6px;padding:22px 22px 8px;border-radius:24px;margin-bottom:4px;color:#eef1ff;background:linear-gradient(135deg,#1d2f7c 0%,#0f1a3f 58%,#0c3f3b 100%);border:1px solid #ffffff1f;box-shadow:0 18px 40px -22px #3b55d9}
.hl{font-size:12px;color:#b8c3f5}
.ht{font-size:28px;font-weight:800;letter-spacing:-.02em}
.ht input{width:110px;font:inherit;color:#f2c14e;background:transparent;border:0;border-bottom:2px dashed #f2c14e88;border-radius:0;padding:0 4px;text-align:center}
.hs{font-size:13px;color:#c9d2f8}
.hero svg{width:100%;height:auto;display:block;margin-top:4px}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 2.2s ease-out infinite}
@keyframes pl{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
.m{align-items:center;gap:12px;border-left-width:0;position:relative;overflow:hidden}
.m::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ok)}
.m.pend::after{background:var(--wa)}.m.off::after{background:var(--er)}
.av{width:46px;height:46px;border-radius:15px;flex:none;display:grid;place-items:center;font:800 16px 'Bricolage Grotesque',sans-serif;color:#fff;background:linear-gradient(145deg,hsl(var(--h) 65% 52%),hsl(calc(var(--h) + 40) 60% 34%))}
.tag{border-radius:8px;padding:3px 9px}.tag.gd{background:#f2c14e22;color:#f2c14e;font-weight:700}
.btn{background:linear-gradient(135deg,#6d8dff,#8a6dff);transition:transform .12s}.btn:active{transform:scale(.97)}.btn.g{background:var(--card)}.btn.r{background:var(--er)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
dialog{border-radius:22px;box-shadow:0 30px 80px -20px #000}
</style></head><body>
<header><h1><span>RDL</span><small>Unis pour l'entreprenariat</small><em id="st"></em></h1>
<nav id="nav"></nav></header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DEF={delai:60,objectif:100,paliers:[{seuil:1,titre:"Propulseur",recomp:"Rôle « Propulseur » sur Discord"},{seuil:3,titre:"Pilote",recomp:"Rôle « Pilote » et casquette RDL brodée"},{seuil:5,titre:"Commandant",recomp:"Rôle « Commandant », t-shirt RDL et portrait vidéo"},{seuil:10,titre:"Ambassadeur",recomp:"Rôle « Ambassadeur » (à définir)"}]};
let M=[],R=[],C=JSON.parse(JSON.stringify(DEF)),tab="dash",q="",fs="all",store=null,mode="local";
const day=86400000,today=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const T=s=>s?new Date(s+"T00:00:00").getTime():null;
const fd=s=>s?new Date(s+"T00:00:00").toLocaleDateString("fr-FR"):"—";
const full=m=>(m.prenom+" "+m.nom).trim();
// ---- stockage : base partagée si dispo, sinon navigateur
const LS={g(k,d){try{return JSON.parse(localStorage.getItem("rdl_"+k))??d}catch(e){return d}},s(k,v){try{localStorage.setItem("rdl_"+k,JSON.stringify(v))}catch(e){}}};
async function init(){
  M=LS.g("m",[]);R=LS.g("r",[]);C=LS.g("c",C);render();
  try{const db=await claude.use("db");if(!db)throw 0;store=db;mode="shared";
    db.collection("membres").onSnapshot(s=>{M=s.docs.map(d=>({id:d.id,...d.data()}));render()});
    db.collection("remises").onSnapshot(s=>{R=s.docs.map(d=>({id:d.id,...d.data()}));render()});
    db.doc("config/paliers").onSnapshot(s=>{if(s.exists)C={...DEF,...s.data()};render()});
  }catch(e){mode="local"}
  $("#st").textContent=mode==="shared"?"● partagé":"○ local (cet appareil)";
}
async function save(col,id,data){
  if(store){try{await store.collection(col).doc(id).set(data)}catch(e){alert("Erreur d'enregistrement : "+(e.message||e))}}
  else{const A=col==="membres"?M:R,i=A.findIndex(x=>x.id===id),o={id,...data};i<0?A.push(o):A[i]=o;LS.s(col==="membres"?"m":"r",A);render()}
}
async function del(col,id){
  if(store){try{await store.collection(col).doc(id).delete()}catch(e){alert(e.message)}}
  else{if(col==="membres")M=M.filter(x=>x.id!==id);else R=R.filter(x=>x.id!==id);LS.s(col==="membres"?"m":"r",col==="membres"?M:R);render()}
}
async function saveC(){if(store){try{await store.doc("config/paliers").set(C)}catch(e){alert(e.message)}}else{LS.s("c",C);render()}}
// ---- calculs
function stats(m){
  const d=C.delai,t=today(),fil=M.filter(x=>x.parrain===m.id);
  const val=fil.filter(f=>{const p=T(f.paiement);if(p==null||p>t-d*day)return false;const j=T(f.depart);return j==null||j>=p+d*day}).length;
  const P=[...C.paliers].sort((a,b)=>a.seuil-b.seuil);
  const meri=P.filter(p=>p.seuil<=val&&val>0).length;
  const rem=R.filter(r=>r.parrain===m.id).length;
  const next=P.find(p=>p.seuil>val);
  return{fil,val,meri,rem,due:Math.max(0,meri-rem),titre:meri?P[meri-1].titre:"",next:next?`${next.titre} : encore ${next.seuil-val} filleul(s) validé(s)`:"Tous les paliers sont atteints",P}
}
const S=m=>stats(m);
// ---- vues
function render(){
  $("#nav").innerHTML=[["dash","Tableau de bord"],["mem","Membres"],["rem","Récompenses"],["pal","Paliers"]].map(([k,n])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';render()">${n}</button>`).join("");
  $("#app").innerHTML=({dash,mem,rem,pal})[tab]();
}
function dash(){
  const act=M.filter(m=>m.statut==="Actif"),pay=M.filter(m=>m.paiement),att=M.filter(m=>!m.paiement&&m.statut==="Actif");
  const mois=new Date().toISOString().slice(0,7),neo=M.filter(m=>(m.entree||"").startsWith(mois));
  const st=M.map(m=>({m,s:S(m)})),ven=M.filter(m=>m.parrain),vali=st.reduce((a,x)=>a+x.s.val,0),cours=ven.length-vali;
  const due=st.reduce((a,x)=>a+x.s.due,0),done=R.length,best=st.filter(x=>x.s.val).sort((a,b)=>b.s.val-a.s.val)[0];
  const pr=Math.min(100,Math.round(act.length/C.objectif*100));
  const k=(v,l,c="")=>`<div class="card"><div class="k ${c}">${v}</div><div class="l">${l}</div></div>`;
  return `${hero(act.length,pr)}<h2>Les membres</h2><div class="grid">${k(M.length,"Membres inscrits")}${k(act.length,"Membres actifs","ok")}${k(pay.length,"Ont payé au moins une fois")}${k(att.length,"1ers paiements en attente","wa")}${k(neo.length,"Nouveaux ce mois-ci")}</div>
  
  <h2>Les parrainages</h2><div class="grid">${k(ven.length,"Venus par parrainage")}${k(vali,"Parrainages validés","ok")}${k(cours,"En cours de validation","wa")}${k(due,"Récompenses à remettre","ac")}${k(done,"Déjà remises")}</div>
  <div class="card"><div class="l">Meilleur parrain</div><div style="font-size:17px;font-weight:600">${best?esc(full(best.m))+` <span class="mu">· ${best.s.val} filleul(s) validé(s)</span>`:"—"}</div></div>
  ${extra()}<p class="mu">Un filleul est validé ${C.delai} jours après son 1er paiement, s'il n'est pas parti entre-temps.</p>`;
}
const hue=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7),ini=m=>((m.prenom||"")[0]||"")+((m.nom||"")[0]||"");
function hero(n,pr){
 const O=C.objectif||100,t=Math.min(1,n/O),b=(a,c,d)=>(1-t)**2*a+2*(1-t)*t*c+t*t*d,x=b(20,260,580),y=b(120,130,20),cx=20+240*t,cy=120+10*t;
 return `<div class="hero"><div><div class="hl">Objectif de la communauté</div><div class="ht">Cap sur <input type="number" min="1" value="${O}" onchange="C.objectif=+this.value||100;saveC()"> membres</div><div class="hs">${n} actifs · ${pr} % du trajet · encore ${Math.max(0,O-n)} à embarquer</div></div>
 <svg viewBox="0 0 600 150"><defs><linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#34d6a0"/><stop offset="1" stop-color="#f2c14e"/></linearGradient></defs><path d="M20 120Q260 130 580 20" fill="none" stroke="#ffffff30" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/><path d="M20 120Q${cx} ${cy} ${x} ${y}" fill="none" stroke="url(#gr)" stroke-width="5" stroke-linecap="round"/><circle class="pulse" cx="${x}" cy="${y}" r="7" fill="#f2c14e"/><circle cx="${x}" cy="${y}" r="7" fill="#f2c14e"/><text x="${x}" y="${y-14}" font-size="22" text-anchor="middle">🚀</text><circle cx="20" cy="120" r="4" fill="#34d6a0"/><circle cx="580" cy="20" r="5" fill="none" stroke="#f2c14e" stroke-width="2"/></svg></div>`;
}
function extra(){
 const t=today(),prix=C.prix||9,k=(v,l,c="")=>`<div class="card"><div class="k ${c}">${v}</div><div class="l">${l}</div></div>`;
 const mrr=M.filter(m=>m.statut==="Actif"&&m.formule==="Mensuel"&&m.paiement).length*prix;
 const quit=M.filter(m=>m.statut!=="Actif").length,ret=M.length?Math.round((1-quit/M.length)*100):100;
 const rel=M.filter(m=>m.statut==="Actif"&&!m.paiement&&m.entree&&t-T(m.entree)>3*day);
 const soon=[];M.filter(m=>m.parrain&&m.paiement&&m.statut==="Actif").forEach(f=>{const v=T(f.paiement)+C.delai*day,j=Math.ceil((v-t)/day);if(j>0&&j<=14)soon.push([f,j])});
 const mo=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);mo.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"))}
 const cnt=mo.map(x=>M.filter(m=>(m.entree||"").startsWith(x)).length),mx=Math.max(1,...cnt);
 const src={};M.forEach(m=>{const s=m.source&&m.source!=="—"?m.source:"Non renseigné";src[s]=(src[s]||0)+1});
 const nm=m=>`<b>${esc(full(m))}</b>${m.tel?` <a style="color:var(--ac)" href="tel:${esc(m.tel)}">📞</a>`:""}`;
 return `<h2>Argent & rétention</h2><div class="grid">${k(mrr+" €","Revenu mensuel estimé (abonnements mensuels payés)","ok")}${k(ret+" %","Rétention (membres encore actifs)")}<div class="card"><div class="l">Prix de l'abonnement (€/mois)</div><input type="number" min="0" step="0.5" value="${prix}" style="margin-top:6px" onchange="C.prix=+this.value;saveC()"></div></div>
 <h2>À faire</h2><div class="list">${rel.map(m=>`<div class="card m pend"><div>${nm(m)}<div class="mu">Entré le ${fd(m.entree)}, toujours pas de 1er paiement : à relancer</div></div></div>`).join("")}${soon.sort((a,b)=>a[1]-b[1]).map(([f,j])=>{const p=M.find(x=>x.id===f.parrain);return `<div class="card m"><div>${nm(f)}<div class="mu">Parrainage de ${p?esc(full(p)):"?"} validé dans ${j} jour(s)</div></div></div>`}).join("")}${rel.length+soon.length?"":`<div class="empty">Rien d'urgent 🎉</div>`}</div>
 <h2>Nouvelles entrées (6 derniers mois)</h2><div class="card" style="display:flex;gap:8px;align-items:flex-end;height:130px">${cnt.map((c,i)=>`<div style="flex:1;text-align:center"><div class="l">${c}</div><div style="height:${Math.round(c/mx*70)+3}px;background:var(--ac);border-radius:5px 5px 0 0"></div><div class="l">${mo[i].slice(5)}/${mo[i].slice(2,4)}</div></div>`).join("")}</div>
 <h2>D'où viennent les membres</h2><div class="card">${Object.entries(src).sort((a,b)=>b[1]-a[1]).map(([s,n])=>`<span class="tag">${esc(s)} · ${n}</span>`).join("")||"—"}</div>`;
}
async function exp(){
 const H=["Prénom","Nom","Téléphone","Email","Formule","Statut","Entrée","1er paiement","Départ","Parrain","Source","Filleuls validés","Titre","Notes"];
 const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
 const rows=M.map(m=>{const s=S(m),p=M.find(x=>x.id===m.parrain);return[m.prenom,m.nom,m.tel,m.email,m.formule,m.statut,m.entree,m.paiement,m.depart,p?full(p):"",m.source,s.val,s.titre,m.notes].map(q).join(";")});
 try{const dl=await claude.use("downloads");if(!dl)throw 0;await dl.save({filename:"rdl-membres.csv",data:"\ufeff"+[H.map(q).join(";"),...rows].join("\n")})}catch(e){if(!e||e.code!=="declined")alert("Export indisponible ici.")}
}
function mem(){
  let L=M.map(m=>({m,s:S(m)}));
  if(q)L=L.filter(x=>(full(x.m)+x.m.email+x.m.tel).toLowerCase().includes(q.toLowerCase()));
  if(fs==="Actif"||fs==="Résilié"||fs==="Exclu")L=L.filter(x=>x.m.statut===fs);
  if(fs==="att")L=L.filter(x=>!x.m.paiement&&x.m.statut==="Actif");
  if(fs==="due")L=L.filter(x=>x.s.due>0);
  L.sort((a,b)=>full(a.m).localeCompare(full(b.m)));
  const opt=(v,n)=>`<option value="${v}" ${fs===v?"selected":""}>${n}</option>`;
  return `<div class="tools"><input placeholder="Rechercher…" value="${esc(q)}" oninput="q=this.value;render();this.focus?.()" id="sq"><select onchange="fs=this.value;render()">${opt("all","Tous")}${opt("Actif","Actifs")}${opt("att","1er paiement en attente")}${opt("due","Récompense à remettre")}${opt("Résilié","Résiliés")}${opt("Exclu","Exclus")}</select><button class="btn g" onclick="exp()">Export CSV</button><button class="btn" onclick="edit()">+ Membre</button></div>
  <div class="list">${L.length?L.map(({m,s})=>{const par=M.find(x=>x.id===m.parrain);const cl=m.statut!=="Actif"?"off":s.due?"rew":!m.paiement?"pend":"";
  return `<div class="card m ${cl}" onclick="edit('${m.id}')"><div class="av" style="--h:${hue(full(m))}">${esc(ini(m)).toUpperCase()}</div><div style="flex:1;min-width:0"><b>${esc(full(m))}</b><div class="mu">${esc(m.formule||"")}${m.source&&m.source!=="—"?" · "+esc(m.source):""} · entré le ${fd(m.entree)}${par?" · parrain : "+esc(full(par)):""}</div>
  <div>${m.statut!=="Actif"?`<span class="tag er">${m.statut}</span>`:""}${!m.paiement&&m.statut==="Actif"?`<span class="tag wa">1er paiement attendu</span>`:`<span class="tag">payé le ${fd(m.paiement)}</span>`}${s.fil.length?`<span class="tag">${s.fil.length} filleul(s) · ${s.val} validé(s)</span>`:""}${s.titre?`<span class="tag gd">🏅 ${esc(s.titre)}</span>`:""}${s.due?`<span class="tag ok">🎁 ${s.due} à remettre</span>`:""}</div></div></div>`}).join(""):`<div class="empty">Aucun membre. Ajoute le premier avec « + Membre ».</div>`}</div>`;
}
function rem(){
  const due=M.map(m=>({m,s:S(m)})).filter(x=>x.s.due>0);
  return `<h2>À remettre</h2><div class="list">${due.length?due.map(({m,s})=>{const p=s.P[s.rem];return `<div class="card m rew"><div><b>${esc(full(m))}</b><div class="mu">${p?esc(p.titre)+" — "+esc(p.recomp):""}</div></div><button class="btn s" onclick="give('${m.id}')">Marquer remise</button></div>`}).join(""):`<div class="empty">Rien à remettre pour le moment.</div>`}</div>
  <h2>Déjà remises</h2><div class="list">${R.length?[...R].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(r=>{const m=M.find(x=>x.id===r.parrain);return `<div class="card m"><div><b>${esc(m?full(m):"(membre supprimé)")}</b><div class="mu">${fd(r.date)} · ${esc(r.recompense)}${r.remarque?" · "+esc(r.remarque):""}</div></div><button class="btn g s" onclick="if(confirm('Annuler cette remise ?'))del('remises','${r.id}')">✕</button></div>`}).join(""):`<div class="empty">Aucune récompense remise.</div>`}</div>`;
}
function pal(){
  const P=C.paliers;
  return `<div class="card"><div class="l">Délai avant qu'un filleul compte (jours après son 1er paiement)</div><input type="number" min="0" value="${C.delai}" style="width:100px;margin-top:6px" onchange="C.delai=+this.value;saveC()"><div class="mu" style="margin-top:6px">60 jours ≈ trois paiements. Mets 0 pour compter dès le premier paiement.</div></div>
  <h2>Paliers</h2><div class="list">${P.map((p,i)=>`<div class="card"><div class="f"><div><label>Filleuls validés requis</label><input type="number" min="1" value="${p.seuil}" onchange="C.paliers[${i}].seuil=+this.value;saveC()"></div><div><label>Titre</label><input value="${esc(p.titre)}" onchange="C.paliers[${i}].titre=this.value;saveC()"></div><div class="w"><label>Récompense</label><input value="${esc(p.recomp)}" onchange="C.paliers[${i}].recomp=this.value;saveC()"></div></div><div class="row"><button class="btn g s" onclick="C.paliers.splice(${i},1);saveC()">Supprimer</button></div></div>`).join("")}</div>
  <div class="row"><button class="btn" onclick="C.paliers.push({seuil:(C.paliers.at(-1)?.seuil||0)+5,titre:'Nouveau palier',recomp:''});saveC()">+ Palier</button></div>`;
}
// ---- formulaires
function edit(id){
  const m=M.find(x=>x.id===id)||{statut:"Actif",formule:"Mensuel",entree:new Date().toISOString().slice(0,10)};
  const o=(arr,v)=>arr.map(a=>`<option ${a===v?"selected":""}>${a}</option>`).join("");
  const par=`<option value="">— aucun —</option>`+M.filter(x=>x.id!==id).sort((a,b)=>full(a).localeCompare(full(b))).map(x=>`<option value="${x.id}" ${x.id===m.parrain?"selected":""}>${esc(full(x))}</option>`).join("");
  const i=(k,l,t="text",c="")=>`<div class="${c}"><label>${l}</label><input id="f_${k}" type="${t}" value="${esc(m[k]||"")}"></div>`;
  $("#dlg").innerHTML=`<h3 style="margin-top:0">${id?"Modifier":"Nouveau"} membre</h3>${m.tel||m.email?`<div class="row" style="justify-content:flex-start;margin:0 0 12px">${m.tel?`<a class="btn g s" style="text-decoration:none" href="tel:${esc(m.tel)}">📞 Appeler</a><a class="btn g s" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${(m.tel.replace(/\D/g,"").replace(/^0/,"33"))}">💬 WhatsApp</a>`:""}${m.email?`<a class="btn g s" style="text-decoration:none" href="mailto:${esc(m.email)}">✉️ Email</a>`:""}</div>`:""}<div class="f">${i("prenom","Prénom")}${i("nom","Nom")}${i("tel","Téléphone","tel")}${i("email","Email","email")}
  <div><label>Formule</label><select id="f_formule">${o(["Mensuel","À vie (1 fois)","À vie (4 × 25 €)","Offert"],m.formule)}</select></div><div><label>Statut</label><select id="f_statut">${o(["Actif","Résilié","Exclu"],m.statut)}</select></div>
  ${i("entree","Date d'entrée sur RDL","date")}${i("paiement","Date du 1er paiement","date")}${i("depart","Date de départ","date")}<div><label>Parrain</label><select id="f_parrain">${par}</select></div>
  <div class="w"><label>Source (comment il a connu RDL)</label><select id="f_source">${o(["—","Bouche-à-oreille","Instagram","TikTok","YouTube","Discord","Autre"],m.source)}</select></div><div class="w"><label>Notes</label><textarea id="f_notes" rows="2">${esc(m.notes||"")}</textarea></div></div>
  <div class="row">${id?`<button class="btn r" onclick="if(confirm('Supprimer ce membre ?')){del('membres','${id}');$('#dlg').close()}" style="margin-right:auto">Supprimer</button>`:""}<button class="btn g" onclick="$('#dlg').close()">Annuler</button><button class="btn" onclick="sv('${id||""}')">Enregistrer</button></div>`;
  $("#dlg").showModal();
}
async function sv(id){
  const g=k=>$("#f_"+k).value.trim();
  if(!g("prenom")&&!g("nom"))return alert("Indique au moins un prénom ou un nom.");
  const d={};["prenom","nom","tel","email","formule","statut","entree","paiement","depart","parrain","source","notes"].forEach(k=>d[k]=g(k));
  $("#dlg").close();await save("membres",id||"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),d);
}
async function give(pid){
  const m=M.find(x=>x.id===pid),s=S(m),p=s.P[s.rem];
  const r=prompt("Remarque (facultatif) :","");if(r===null)return;
  await save("remises","r"+Date.now().toString(36),{date:new Date().toISOString().slice(0,10),parrain:pid,recompense:p?p.titre+" — "+p.recomp:"Récompense",remarque:r});
}
init();
</script></body></html>
